services:
  honeybudget:
    build:
      context: .
      dockerfile: Dockerfile
    image: honeybudget:latest
    container_name: honeybudget
    restart: unless-stopped
    ports:
      - "${HONEYBUDGET_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
